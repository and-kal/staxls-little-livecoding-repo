<!-- index.html -->
<!DOCTYPE html>
<html>
  <head>
    <title></title>

    <!-- get textmode.js from their github: https://github.com/humanbydefinition/textmode.js/releases/ -->
    <script src="./libs/textmode.umd.js"></script>
  </head>
  <body>
    <script>
      const tm = textmode.create({
        width: window.innerWidth,
        height: window.innerHeight,
        fontSize: 16,
        frameRate: 60,
      });

      tm.setup(() => {
        // Optional setup code here (e.g., load fonts/shaders, initialize variables that access 't')
      });

      tm.draw(() => {
        // tm.background(0, 255, 255, 0);
        // example from frontpage
        const halfCols = tm.grid.cols / 2;
        const halfRows = tm.grid.rows / 2;

        for (let y = -halfRows; y < halfRows; y++) {
          for (let x = -halfCols; x < halfCols; x++) {
            const dist = Math.sqrt(x * x + y * y);
            const wave = Math.sin(dist * 0.4 - tm.frameCount * 0.1);
            tm.push();
            tm.translate(x, y, 0);
            tm.char(wave > 0.5 ? "▓" : wave > 0 ? "▒" : "░");
            tm.charColor(0, 150 + wave * 100, 255, 0.5);
            tm.point();
            tm.pop();
          }
        }
      });

      tm.windowResized(() => {
        tm.resizeCanvas(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
